name: WorldCupMagic

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # 02:17 UK time during the tournament's summer schedule. Accuracy is preferred over speed.
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: worldcupmagic-pages
  cancel-in-progress: false

jobs:
  github-pages:
    name: Build Full Web Edition
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.ref_type != 'tag'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run web:build-data
      - name: Preserve current published lineup feed
        run: |
          mkdir -p web/data
          curl --fail --location --silent --show-error https://corentis-88.github.io/WorldCupMagik/data/lineups-latest.json --output /tmp/published-lineups.json || echo "No published lineup feed to preserve."
          if [ -f /tmp/published-lineups.json ]; then
            node <<'NODE'
          const fs = require("fs");
          const localPath = "web/data/lineups-latest.json";
          const publishedPath = "/tmp/published-lineups.json";
          const readJson = (path) => {
            if (!fs.existsSync(path)) return null;
            try { return JSON.parse(fs.readFileSync(path, "utf8")); } catch { return null; }
          };
          const local = readJson(localPath);
          const published = readJson(publishedPath);
          const localTime = Date.parse(local?.generatedAt || 0);
          const publishedTime = Date.parse(published?.generatedAt || 0);
          if (!local || publishedTime > localTime) {
            fs.copyFileSync(publishedPath, localPath);
            console.log("Using newer published lineup feed.");
          } else {
            console.log("Keeping repository lineup feed because it is newer.");
          }
          NODE
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        if: github.event_name != 'pull_request'
        uses: actions/deploy-pages@v4
      - name: Persist scanner database
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          npm run data:guard
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web/data
          if git diff --cached --quiet; then
            echo "No scanner database changes to persist."
          else
            git commit -m "Update WorldCupMagik public-web database [skip ci]"
            for attempt in 1 2 3; do
              git push && break
              if [ "$attempt" = "3" ]; then
                echo "Persist push failed after 3 attempts."
                exit 1
              fi
              git pull --rebase --autostash origin main
              sleep 8
            done
          fi
