name: WorldCupMagic

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 5,8,11,14,17,20,21,23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  github-pages:
    name: Build Full Web Edition
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run web:build-data
      - name: Persist scanner database
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web/data
          if git diff --cached --quiet; then
            echo "No scanner database changes to persist."
          else
            git commit -m "Update WorldCupMagik public-web database [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        if: github.event_name != 'pull_request'
        uses: actions/deploy-pages@v4
