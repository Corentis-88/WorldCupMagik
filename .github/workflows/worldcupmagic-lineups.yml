name: WorldCupMagic Lineups

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: worldcupmagic-pages
  cancel-in-progress: false

jobs:
  lineup-check:
    name: Quick Lineup Check
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Preserve current published database
        run: |
          mkdir -p web/data
          curl --fail --location --silent --show-error https://corentis-88.github.io/WorldCupMagik/data/latest.json --output web/data/latest.json || echo "Using repository database fallback."
          curl --fail --location --silent --show-error https://corentis-88.github.io/WorldCupMagik/data/mobile-latest.json --output web/data/mobile-latest.json || echo "Using repository mobile database fallback."
          curl --fail --location --silent --show-error https://corentis-88.github.io/WorldCupMagik/data/lineups-latest.json --output web/data/lineups-latest.json || echo "No previous lineup feed to preserve."
          if [ ! -f web/data/mobile-latest.json ] && [ -f web/data/latest.json ]; then npm run web:build-mobile-data; fi
      - name: Build lineup feed with final-pass retries
        env:
          LINEUP_FINAL_PASS_MINUTES_BEFORE: "28"
          LINEUP_FINAL_PASS_TOLERANCE_MINUTES: "4"
        run: |
          for attempt in 1 2 3; do
            npm run lineups:build && break
            if [ "$attempt" = "3" ]; then
              echo "Lineup build failed after 3 attempts."
              exit 1
            fi
            sleep 20
          done
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
